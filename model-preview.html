<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>分泌蛋白模型预览</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090d13;
        color: #eef5ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, rgba(76, 201, 240, 0.22), transparent 34rem),
          radial-gradient(circle at 85% 15%, rgba(255, 184, 77, 0.14), transparent 30rem),
          #090d13;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        font-weight: 650;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .panel {
        overflow: hidden;
        border: 1px solid rgba(170, 213, 255, 0.18);
        border-radius: 8px;
        background: rgba(12, 20, 31, 0.72);
      }

      .label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(170, 213, 255, 0.14);
        color: #cfe7ff;
        font-size: 14px;
      }

      model-viewer {
        display: block;
        width: 100%;
        height: 62vh;
        min-height: 420px;
        background: linear-gradient(180deg, rgba(20, 31, 47, 0.7), rgba(5, 8, 13, 0.88));
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }

        model-viewer {
          height: 52vh;
          min-height: 340px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>3D 模型预览</h1>
      <section class="grid" aria-label="模型预览">
        <article class="panel">
          <div class="label"><span>高尔基体</span><span>约 33 MB</span></div>
          <model-viewer src="./assets/golgi.glb" camera-controls auto-rotate shadow-intensity="0.7" exposure="1.05"></model-viewer>
        </article>
        <article class="panel">
          <div class="label"><span>核糖体</span><span>约 58 MB</span></div>
          <model-viewer src="./assets/ribosome.glb" camera-controls auto-rotate shadow-intensity="0.7" exposure="1.05"></model-viewer>
        </article>
        <article class="panel">
          <div class="label"><span>内质网</span><span>约 37 MB</span></div>
          <model-viewer src="./assets/er.glb" camera-controls auto-rotate shadow-intensity="0.7" exposure="1.05"></model-viewer>
        </article>
      </section>
    </main>
  </body>
</html>
